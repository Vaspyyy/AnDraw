name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: andraw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  publish-release:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: andraw-debug-apk
          path: dist

      - name: Name installable APK
        run: mv dist/app-debug.apk dist/AnDraw-v0.1.1.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: AnDraw v0.1.1
          body: |
            AnDraw v0.1.1 fixes unreliable image loading by copying selected references into app-private storage.

            - Import anime fanart from your device
            - Live rear-camera tracing overlay
            - Drag, pinch, and rotate alignment, with lock
            - Ink-only line-art mode, opacity, brightness, guides, grayscale, torch
            - Cozy Material 3 interface
            - Fix for images that previously failed to load in tracing studio

            Install: download `AnDraw-v0.1.1.apk` below, open it on Android, and allow installation when prompted.
          files: dist/AnDraw-v0.1.1.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
