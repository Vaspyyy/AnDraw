name: Signed Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Decode persistent release keystore
        env:
          AN_DRAW_KEYSTORE_BASE64: ${{ secrets.AN_DRAW_KEYSTORE_BASE64 }}
        run: |
          test -n "$AN_DRAW_KEYSTORE_BASE64" || (echo "Missing AN_DRAW_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$AN_DRAW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/andraw-release.jks"

      - name: Build signed release APK
        env:
          AN_DRAW_KEYSTORE_PATH: ${{ runner.temp }}/andraw-release.jks
          AN_DRAW_KEYSTORE_PASSWORD: ${{ secrets.AN_DRAW_KEYSTORE_PASSWORD }}
          AN_DRAW_KEY_ALIAS: ${{ secrets.AN_DRAW_KEY_ALIAS }}
          AN_DRAW_KEY_PASSWORD: ${{ secrets.AN_DRAW_KEY_PASSWORD }}
        run: |
          test -n "$AN_DRAW_KEYSTORE_PASSWORD" || (echo "Missing AN_DRAW_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$AN_DRAW_KEY_ALIAS" || (echo "Missing AN_DRAW_KEY_ALIAS repository secret" && exit 1)
          test -n "$AN_DRAW_KEY_PASSWORD" || (echo "Missing AN_DRAW_KEY_PASSWORD repository secret" && exit 1)
          gradle assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AnDraw-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: AnDraw ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/AnDraw-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
